server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000        # 15 minutes (silent refresh via refresh token)
    refresh-token-expiry-ms: 1296000000   # 15 days — hard logout after this if unused
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  public-url: ${PUBLIC_URL:http://localhost}
  public-frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:https://app.antrahq.com}
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    whatsapp-integrated-number: ${MSG91_WHATSAPP_NUMBER:}
    bill-receipt-template: ${MSG91_BILL_RECEIPT_TEMPLATE:bill_receipt}
    promo-template: ${MSG91_PROMO_TEMPLATE:salon_promo}
    appointment-confirmed-template: ${MSG91_APPOINTMENT_CONFIRMED_TEMPLATE:salon_appointment_confirmed_v2}
    promo-sms-flow-id: ${MSG91_PROMO_SMS_FLOW_ID:}
    sms-sender: ${MSG91_SMS_SENDER:}
  ses:
    enabled: ${SES_ENABLED:false}
    from-address: ${SES_FROM_ADDRESS:}
    region: ${AWS_REGION:ap-south-1}
  password-reset:
    token-expiry-minutes: 60
    frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:https://app.antrahq.com}
  attendance:
    photos:
      # Prefer dedicated attendance bucket; otherwise reuse invoice/deploy bucket.
      s3-bucket: ${ATTENDANCE_S3_BUCKET:${INVOICE_S3_BUCKET:}}
      key-prefix: ${ATTENDANCE_S3_PREFIX:attendance/}
      storage-dir: ${ATTENDANCE_PHOTO_DIR:data/attendance-photos}
      aws-region: ${AWS_REGION:ap-south-1}
  invoice-pdf:
    s3-bucket: ${INVOICE_S3_BUCKET:}
    key-prefix: ${INVOICE_S3_PREFIX:invoices/}
    local-dir: ${INVOICE_PDF_DIR:data/invoice-pdfs}
    aws-region: ${AWS_REGION:ap-south-1}
  reviews:
    token-secret: ${JWT_SECRET}
    token-expiry-days: 7
    public-frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:https://app.antrahq.com}
    google-auto-publish-enabled: true
    google-auto-publish-min-rating: 4
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      pilot-branch-code: VAR
      pilot-tenant-slug: demo-brand
      sync-cache-hours: 24
      default-radius-meters: 2000
  production-data-protection:
    enabled: true
    protected-tenant-slugs:
      - mystic-wellness
    allowed-branch-catalog-patches:
      - varthur-menu-v1
      - varthur-menu-v2
      - varthur-menu-v3
