name: Build and Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a swap mid-flight.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: salon-platform-prod-backend
  # SSM path written by Terraform; override via repo variable if needed
  DEPLOY_SSM_TARGET_PARAM: ${{ vars.DEPLOY_SSM_TARGET_PARAM || '/salon-platform-prod/deploy/ssm_target' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        id: deploy
        run: |
          set -euo pipefail
          DEFAULT_TARGETS="Key=tag:DeployTarget,Values=salon-platform-prod-app"
          if TARGETS=$(aws ssm get-parameter \
            --name "$DEPLOY_SSM_TARGET_PARAM" \
            --query Parameter.Value --output text 2>/dev/null); then
            echo "SSM deploy target (from parameter): $TARGETS"
          else
            TARGETS="$DEFAULT_TARGETS"
            echo "SSM deploy target (fallback tag): $TARGETS"
          fi
          CMD_ID=$(aws ssm send-command \
            --targets "$TARGETS" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters 'commands=["/opt/salon-platform/scripts/deploy.sh backend"]' \
            --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      # Green must mean "deployed", not "deploy command sent": wait for the host to finish
      # the image pull and container swap, then for the API to answer again.
      - name: Wait for the host to finish the swap
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.deploy.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUSES=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[].Status' --output text)
            echo "host command status: ${STATUSES:-none yet}"
            case "$STATUSES" in
              *Failed*|*Cancelled*|*TimedOut*)
                echo "::error::Deploy command failed on the host"
                exit 1 ;;
              *Pending*|*InProgress*|*Delayed*|"") sleep 10 ;;
              *) exit 0 ;;
            esac
          done
          echo "::error::Timed out waiting for the host deploy command"
          exit 1

      - name: Wait for the API to answer
        run: |
          # 401 is healthy here (auth is on); 5xx or no answer means the app is still starting.
          for i in $(seq 1 72); do
            CODE=$(curl -s -o /dev/null -m 10 -w '%{http_code}' https://api.antrahq.com/actuator/health || true)
            echo "api health: $CODE"
            case "$CODE" in
              2??|3??|4??) exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::API did not recover within 6 minutes of the swap"
          exit 1
