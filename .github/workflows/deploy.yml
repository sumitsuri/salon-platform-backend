name: Build and Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: salon-platform-prod-backend
  # SSM path written by Terraform; override via repo variable if needed
  DEPLOY_SSM_TARGET_PARAM: ${{ vars.DEPLOY_SSM_TARGET_PARAM || '/salon-platform-prod/deploy/ssm_target' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --push .

      - name: Deploy to EC2 via SSM
        run: |
          set -euo pipefail
          DEFAULT_TARGETS="Key=tag:DeployTarget,Values=salon-platform-prod-app"
          if TARGETS=$(aws ssm get-parameter \
            --name "$DEPLOY_SSM_TARGET_PARAM" \
            --query Parameter.Value --output text 2>/dev/null); then
            echo "SSM deploy target (from parameter): $TARGETS"
          else
            TARGETS="$DEFAULT_TARGETS"
            echo "SSM deploy target (fallback tag): $TARGETS"
          fi
          aws ssm send-command \
            --targets "$TARGETS" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters 'commands=["/opt/salon-platform/scripts/deploy.sh backend"]' \
            --output text
